extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Bearer-token auth for the OTLP receiver. Token is fetched from the
  # credentials-server at startup (see entrypoint.sh) and shared with the test
  # framework via the credentials tarball.
  bearertokenauth:
    scheme: Bearer
    filename: /tmp/otel_collector_token
  # Bearer-token auth for the InfluxDB exporter. Distinct from the unnamed
  # `bearertokenauth` above (the OTLP receiver's): this is the InfluxDB 3 admin
  # token minted by the setup container, fetched at startup by entrypoint.sh.
  bearertokenauth/influxdb:
    scheme: Bearer
    filename: /tmp/influxdb_token

receivers:
  # TLS-only gRPC receiver — there is no cleartext transport. The cert + key
  # are fetched from the credentials-server at startup (see entrypoint.sh);
  # the cert is valid for every host the collector is reachable under
  # (localhost / docker / otel-collector), so exporters verify it against the
  # endpoint host they already resolve.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTEL_GRPC_PORT}
        include_metadata: true
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: /tmp/otel_collector_cert
          key_file: /tmp/otel_collector_key
          client_ca_file: /tmp/otel_collector_client_ca

exporters:
  otlp_grpc/jaeger:
    endpoint: ${env:JAEGER_HOSTNAME}:${env:JAEGER_OTLP_GRPC_PORT}
    tls:
      insecure: true

  # `bucket` maps to an InfluxDB 3 database name, so queries pass
  # `{"db": "otel"}`. The telegraf-prometheus-v1 schema writes one measurement
  # per metric name, with resource + scope + datapoint attributes as tags.
  influxdb:
    endpoint: http://${env:INFLUXDB_HOSTNAME}:${env:INFLUXDB_PORT}
    bucket: otel
    metrics_schema: telegraf-prometheus-v1
    auth:
      authenticator: bearertokenauth/influxdb

service:
  extensions: [health_check, bearertokenauth, bearertokenauth/influxdb]
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [influxdb]
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/jaeger]
