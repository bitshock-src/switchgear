[package]
name = "switchgear-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Bitshock <info@bitshock.com>"]
description = "Metric emission macros (monotonic_counter, counter, histogram, gauge) over tracing for the Switchgear workspace"
documentation = "https://github.com/bitshock-src/switchgear"
homepage = "https://bitshock.com"
repository = "https://github.com/bitshock-src/switchgear"
license = "Apache-2.0"
keywords = ["metrics", "tracing", "opentelemetry", "otlp"]
categories = ["development-tools::debugging", "development-tools::profiling"]
publish = true

[dependencies]
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
trybuild = "1"
