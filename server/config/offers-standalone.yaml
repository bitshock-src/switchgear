# Offers service standalone configuration
# Run only the offers management service for LNURL offer creation
# Suitable for centralized offer management deployments
offer-service:
  address: "${OFFER_SERVICE_ADDRESS:-127.0.0.1:8082}"
  auth-authority: "${OFFER_SERVICE_AUTH_AUTHORITY_PATH:-/etc/ssl/certs/offer-auth-authority.pem}"
  tls:
    cert-path: "${OFFER_SERVICE_TLS_CERT_PATH:-/etc/ssl/certs/offer-cert.pem}"
    key-path: "${OFFER_SERVICE_TLS_KEY_PATH:-/etc/ssl/certs/offer-key.pem}"
  max-page-size: 100
  otlp:
    export:
      endpoint: "${OFFER_SERVICE_OTLP_ENDPOINT:-http://127.0.0.1:4317}"
      auth-token: "OTEL_AUTH_TOKEN"
      trusted-roots: ${OFFER_SERVICE_OTLP_TRUSTED_ROOTS:-}
      trusted-root-address: ${OFFER_SERVICE_OTLP_TRUSTED_ROOT_ADDRESS:-}
      export-timeout-secs: 5.0
      client-identity:
        cert-secret: "OTEL_CLIENT_CERT"
        key-secret: "OTEL_CLIENT_KEY"
      secrets:
        ttl: 300.0
        secrets:
          OTEL_AUTH_TOKEN:
            path: "${OFFER_SERVICE_OTLP_AUTH_TOKEN:-/etc/ssl/certs/otlp-auth.token}"
          OTEL_CLIENT_CERT:
            path: "${OFFER_SERVICE_OTLP_CLIENT_CERT:-}"
          OTEL_CLIENT_KEY:
            path: "${OFFER_SERVICE_OTLP_CLIENT_KEY:-}"
    tracing:
      sampler:
        type: parent-based-trace-id-ratio
        ratio: 1.0
    metrics:
      temporality: cumulative
# Storage configuration
store:
  offer:
    type: "memory"
