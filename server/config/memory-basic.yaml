# Memory-based configuration for basic testing and development
# All data stored in memory, lost on restart
# Suitable for unit tests and quick development iterations
lnurl-service:
  partitions: [ "default" ]
  address: "${LNURL_SERVICE_ADDRESS:-127.0.0.1:8080}"
  health-check-frequency-secs: 1.0
  parallel-health-check: true
  health-check-consecutive-success-to-healthy: 1
  health-check-consecutive-failure-to-unhealthy: 1
  backend-update-frequency-secs: 1.0
  invoice-expiry-secs: 180
  ln-client-timeout-secs: 2.0
  ln-trusted-roots: ${LN_TRUSTED_ROOTS:-}
  allowed-hosts: [ "${LNURL_SERVICE_ALLOWED_HOSTS:-}" ]
  backoff:
    type: "exponential"
    max-elapsed-time-secs: 2.5
  backend-selection: "round-robin"
  selection-capacity-bias: -0.2
  tls:
    cert-path: "${LNURL_SERVICE_TLS_CERT_PATH:-/etc/ssl/certs/lnurl-cert.pem}"
    key-path: "${LNURL_SERVICE_TLS_KEY_PATH:-/etc/ssl/certs/lnurl-key.pem}"
  bech32-qr-scale: 8
  bech32-qr-light: 255
  bech32-qr-dark: 0
  otlp:
    export:
      endpoint: "${LNURL_SERVICE_OTLP_ENDPOINT:-http://127.0.0.1:4317}"
      auth-token: "OTEL_AUTH_TOKEN"
      trusted-roots: ${LNURL_SERVICE_OTLP_TRUSTED_ROOTS:-}
      trusted-root-address: ${LNURL_SERVICE_OTLP_TRUSTED_ROOT_ADDRESS:-}
      export-timeout-secs: 5.0
      client-identity:
        cert-secret: "OTEL_CLIENT_CERT"
        key-secret: "OTEL_CLIENT_KEY"
      secrets:
        ttl: 300.0
        secrets:
          OTEL_AUTH_TOKEN:
            path: "${LNURL_SERVICE_OTLP_AUTH_TOKEN:-/etc/ssl/certs/otlp-auth.token}"
          OTEL_CLIENT_CERT:
            path: "${LNURL_SERVICE_OTLP_CLIENT_CERT:-}"
          OTEL_CLIENT_KEY:
            path: "${LNURL_SERVICE_OTLP_CLIENT_KEY:-}"
    tracing:
      sampler:
        type: parent-based-trace-id-ratio
        ratio: 1.0
    metrics:
      temporality: cumulative
discovery-service:
  address: "${DISCOVERY_SERVICE_ADDRESS:-127.0.0.1:8081}"
  auth-authority: "${DISCOVERY_SERVICE_AUTH_AUTHORITY_PATH:-/etc/ssl/certs/discovery-auth-authority.pem}"
  tls:
    cert-path: "${DISCOVERY_SERVICE_TLS_CERT_PATH:-/etc/ssl/certs/discovery-cert.pem}"
    key-path: "${DISCOVERY_SERVICE_TLS_KEY_PATH:-/etc/ssl/certs/discovery-key.pem}"
  otlp:
    # Required. Both signals below export over this one connection unless they
    # carry an `export` block of their own, which replaces it in full.
    export:
      endpoint: "${DISCOVERY_SERVICE_OTLP_ENDPOINT:-http://127.0.0.1:4317}"
      auth-token: "OTEL_AUTH_TOKEN"
      trusted-roots: ${DISCOVERY_SERVICE_OTLP_TRUSTED_ROOTS:-}
      trusted-root-address: ${DISCOVERY_SERVICE_OTLP_TRUSTED_ROOT_ADDRESS:-}
      export-timeout-secs: 5.0
      client-identity:
        cert-secret: "OTEL_CLIENT_CERT"
        key-secret: "OTEL_CLIENT_KEY"
      secrets:
        ttl: 300.0
        secrets:
          OTEL_AUTH_TOKEN:
            path: "${DISCOVERY_SERVICE_OTLP_AUTH_TOKEN:-/etc/ssl/certs/otlp-auth.token}"
          OTEL_CLIENT_CERT:
            path: "${DISCOVERY_SERVICE_OTLP_CLIENT_CERT:-}"
          OTEL_CLIENT_KEY:
            path: "${DISCOVERY_SERVICE_OTLP_CLIENT_KEY:-}"
    tracing:
      # `ratio: 1.0` under parent-based-trace-id-ratio reproduces the SDK default.
      sampler:
        type: parent-based-trace-id-ratio
        ratio: 1.0
    metrics:
      temporality: cumulative
offer-service:
  address: "${OFFER_SERVICE_ADDRESS:-127.0.0.1:8082}"
  auth-authority: "${OFFER_SERVICE_AUTH_AUTHORITY_PATH:-/etc/ssl/certs/offer-auth-authority.pem}"
  tls:
    cert-path: "${OFFER_SERVICE_TLS_CERT_PATH:-/etc/ssl/certs/offer-cert.pem}"
    key-path: "${OFFER_SERVICE_TLS_KEY_PATH:-/etc/ssl/certs/offer-key.pem}"
  max-page-size: 100
  otlp:
    # Required. Both signals below export over this one connection unless they
    # carry an `export` block of their own, which replaces it in full.
    export:
      endpoint: "${OFFER_SERVICE_OTLP_ENDPOINT:-http://127.0.0.1:4317}"
      auth-token: "OTEL_AUTH_TOKEN"
      trusted-roots: ${OFFER_SERVICE_OTLP_TRUSTED_ROOTS:-}
      trusted-root-address: ${OFFER_SERVICE_OTLP_TRUSTED_ROOT_ADDRESS:-}
      export-timeout-secs: 5.0
      client-identity:
        cert-secret: "OTEL_CLIENT_CERT"
        key-secret: "OTEL_CLIENT_KEY"
      secrets:
        ttl: 300.0
        secrets:
          OTEL_AUTH_TOKEN:
            path: "${OFFER_SERVICE_OTLP_AUTH_TOKEN:-/etc/ssl/certs/otlp-auth.token}"
          OTEL_CLIENT_CERT:
            path: "${OFFER_SERVICE_OTLP_CLIENT_CERT:-}"
          OTEL_CLIENT_KEY:
            path: "${OFFER_SERVICE_OTLP_CLIENT_KEY:-}"
    tracing:
      # `ratio: 1.0` under parent-based-trace-id-ratio reproduces the SDK default.
      sampler:
        type: parent-based-trace-id-ratio
        ratio: 1.0
    metrics:
      temporality: cumulative
store:
  offer:
    type: "memory"
  discover:
    type: "memory"
