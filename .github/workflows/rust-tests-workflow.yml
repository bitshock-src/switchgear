name: Rust Tests

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  tests:
    name: Format, Clippy, Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci-rust:1.97.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: -v /var/run/docker.sock:/var/run/docker.sock
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Start Docker Compose services
        run: |
          cd testing
          date +%s > ./compose-start
          nohup /bin/sh -c 'docker compose --env-file ./testing.env up -d --build --wait; date +%s > ./compose-ready' > compose.log 2>&1 &
          cd ..

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run clippy for panics
        run: cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Run clippy on tests
        run: cargo clippy --tests -- -D warnings

      - name: Compile tests
        run: |
          cargo test --no-run

      - name: Wait for integration tests services
        run: |
          cd testing

          MAX_WAIT=300
          ELAPSED=0
          while [ ! -f ./compose-ready ] && [ $ELAPSED -lt $MAX_WAIT ]; do
            docker compose --env-file ./testing.env ps --format "table {{.Service}}\t{{.Status}}" || true
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          if [ ! -f ./compose-ready ]; then
            echo "Docker compose did not complete in ${MAX_WAIT}s"
            cat ./compose.log || true
            exit 1
          fi

          echo "compose services ready after $(( $(cat ./compose-ready) - $(cat ./compose-start) ))s"

          . ./testing.env && docker network connect $SERVICES_NETWORK_NAME $(hostname)
          cd ..

      - name: Run tests
        run: |
          cp testing/testing.env ./testing.env
          cargo test

      - name: Stop Docker Compose services
        if: always()
        run: docker compose --env-file testing/testing.env -f testing/docker-compose.yml down -v
